[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ingredient-mass-estimation"
version = "0.1.0"
description = "Low-compute ingredient recognition and per-ingredient mass estimation"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.3,<3",
  "torchvision>=0.18,<1",
  "numpy>=1.24,<3",
  "Pillow>=10,<13",
  "tqdm>=4.66,<5",
]

[project.optional-dependencies]
depth = ["opencv-python-headless>=4.10,<4.12"]

[tool.setuptools.packages.find]
where = ["src"]

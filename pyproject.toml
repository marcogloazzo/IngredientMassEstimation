[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ingredient-mass-estimation"
version = "0.1.0"
description = "Low-compute ingredient recognition and per-ingredient mass estimation"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.1,<3",
  "torchvision>=0.16,<1",
  "numpy>=1.24,<2",
  "Pillow>=10,<13",
  "tqdm>=4.66,<5",
]

[tool.setuptools.packages.find]
where = ["src"]
